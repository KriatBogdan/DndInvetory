<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DND Gacha</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
    background: #1e1e1e;
    color: white;
    font-family: sans-serif;
    text-align: center;
}

h1 {
    margin-top: 20px;
}

button {
    padding: 12px 20px;
    font-size: 18px;
    margin: 10px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
}

.roll {
    background: #4caf50;
    color: white;
}

.inventory {
    background: #2196f3;
    color: white;
}

.card {
    background: #2a2a2a;
    margin: 10px;
    padding: 10px;
    border-radius: 10px;
}
</style>
</head>

<body>

<h1>🎮 DND Gacha</h1>

<button class="roll" onclick="roll()">🎰 Крутить</button>
<button class="inventory" onclick="loadInventory()">🎒 Инвентарь</button>

<div id="result"></div>
<div id="inventory"></div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

// ⚠️ ВАЖНО: тут буде user.id
const user = tg.initDataUnsafe.user;

// 🔗 ВСТАВ СЮДИ СВОЙ NGROK ИЛИ СЕРВЕР
const API_URL = "https://ТВОЙ-НГРОК.ngrok.io";

// 🎰 ГАЧА
async function roll() {
    let res = await fetch(API_URL + "/roll", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            user_id: user.id
        })
    });

    let item = await res.json();

    document.getElementById("result").innerHTML =
        `<div class="card">🎰 Выпало:<br>${item.name} (${item.rarity})</div>`;
}

// 🎒 ІНВЕНТАР
async function loadInventory() {
    let res = await fetch(API_URL + "/inventory", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            user_id: user.id
        })
    });

    let inventory = await res.json();

    if (inventory.length === 0) {
        document.getElementById("inventory").innerHTML = "Пусто";
        return;
    }

    let counted = {};

    inventory.forEach(item => {
        let key = item.name + "_" + item.rarity;
        counted[key] = counted[key] ? counted[key] + 1 : 1;
    });

    let html = "";

    for (let key in counted) {
        let parts = key.split("_");
        let name = parts[0];
        let rarity = parts[1];

        html += `<div class="card">${name} (${rarity}) x${counted[key]}</div>`;
    }

    document.getElementById("inventory").innerHTML = html;
}
</script>

</body>
</html>
